# Postgres для приложения. Пароль суперпользователя postgres = admin
# (совпадает с хешем в cfg.ini; поменяешь пароль - поменяй и хеш).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
